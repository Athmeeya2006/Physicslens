name: galilean_resonance
title: "Io, Europa and Ganymede in resonance"
description: >
  Jupiter's moons Io, Europa and Ganymede orbit in a 1:2:4 resonance: Io laps Europa twice for each time Europa laps
  Ganymede, and the three never line up. With their mutual pulls and Jupiter's flattening (J2) switched on, the
  resonance angle stays locked; the moons' orbits are the JPL ones at J2000.
