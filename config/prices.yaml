# USD. Token prices are per 1M tokens (confirmed on Meta's Pricing and rate limits page, Oct 27 2026).
# A model with no entry here (or a null price) is REFUSED by costguard.

meta_api:
  muse-spark-1.3:
    input: 1.25
    cached_input: 0.15
    output: 4.25          # reasoning tokens are billed as output
  muse-spark-1.3-contributor:
    input: 0.10
    cached_input: 0.002
    output: 0.20
  sam-3.1:
    image: 0.0025         # $2.50 per 1,000 images
    video_frame: 0.0002   # $0.20 per 1,000 frames; minimum 50 frames billed per video request
  muse-voice-transcribe-1.0:
    audio_hour: 0.18      # billed in whole seconds

baseten:
  meta-models/muse-spark-open-1026:
    input: null           # TODO(verify) from Baseten model page. While null, costguard refuses Baseten calls.
    output: null          # TODO(verify)

# Expected cost of one 10-second recorded run: ~$0.10. Much more than that = a bug; stop and investigate.

glimmer:
  muse-glimmer-30b:       # self-hosted on a free GPU notebook: no per-token charge
    input: 0.0
    output: 0.0
