# USD. Token prices are per 1M tokens (confirmed on Meta's Pricing and rate limits page, Oct 27 2026).
# A model with no entry here (or a null price) is REFUSED by costguard.

meta_api:
  muse-spark-1.3:
    input: 1.25
    cached_input: 0.15
    output: 4.25          # reasoning tokens are billed as output
  muse-spark-1.3-contributor:
    input: 0.10
    cached_input: 0.002
    output: 0.20
  sam-3.1:
    image: 0.0025         # $2.50 per 1,000 images
    video_frame: 0.0002   # $0.20 per 1,000 frames; minimum 50 frames billed per video request
  muse-voice-transcribe-1.0:
    audio_hour: 0.18      # billed in whole seconds
  muse-image-1.0:
    image: 0.01           # per generated image returned; failed or safety-filtered images are not billed
  muse-wonder-1.0:        # Standard mode (Meta's Pricing and rate limits page, Oct 28 2026); no contributor mode
    input: 4.00
    cached_input: 0.20
    output: 20.00         # reasoning tokens are billed as output

glimmer:
  muse-glimmer-30b:       # self-hosted on our own GPU server: no per-token charge
    input: 0.0
    output: 0.0

together:
  meta-models/Muse-Glimmer-30B:   # from Together's model page as quoted in Meta's Glimmer deploy guide, Oct 28 2026
    input: 0.35
    cached_input: 0.04
    output: 1.50
