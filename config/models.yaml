# Model allowlist. costguard/client.py refuses any model ID not listed here.
# NEVER add: muse-wonder-1.0, muse-image-1.0 (too expensive / not needed).

meta_api:
  base_url: https://api.meta.ai/v1
  api_key_env: MODEL_API_KEY
  models:
    muse-spark-1.3:
      use: development-only reasoning; demo and prod refuse it and reason on Muse Glimmer
      api: responses
    muse-spark-1.3-contributor:
      use: same as muse-spark-1.3 in APP_ENV=dev only, if the account has access
      api: responses
      note: Meta may train on inputs/outputs; 150 RPM; no "max" reasoning
    sam-3.1:
      use: video tracking + reference-object segmentation
      api: responses (streaming)
    muse-voice-transcribe-1.0:
      use: voice what-if questions
      api: websocket wss://api.meta.ai/v1/asr/realtime

# Muse Glimmer: open weights, self-hosted with llama.cpp (llama-server, OpenAI Chat Completions).
# Weights: meta-models/Muse-Glimmer-30B-GGUF, Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf + mmproj (vision).
glimmer:
  base_url_env: GLIMMER_BASE_URL    # e.g. http://127.0.0.1:8080/v1 on the GPU machine running llama-server
  api_key_env: GLIMMER_API_KEY      # the --api-key given to llama-server
  models:
    muse-glimmer-30b:
      use: open-weight reasoning (scene understanding, hypotheses, agent decisions, explanations)
      api: chat_completions
      note: reasoning cannot be switched off; strength low|medium|high|xhigh via chat_template_kwargs

# The same open weights on a hosted provider listed in Meta's Glimmer deploy guide (OpenAI Chat Completions).
together:
  base_url: https://api.together.xyz/v1
  api_key_env: TOGETHER_API_KEY
  models:
    meta-models/Muse-Glimmer-30B:
      use: open-weight reasoning, hosted (same roles as muse-glimmer-30b)
      api: chat_completions
      note: Together caps generation at 32,768 output tokens per request
