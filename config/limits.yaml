# Self-imposed limits (far below provider limits on purpose: money is the constraint).
requests_per_minute:
  muse-spark-1.3: 30
  muse-spark-1.3-contributor: 30
  sam-3.1: 60
  muse-glimmer-30b: 10
  meta-models/Muse-Glimmer-30B: 20
  muse-image-1.0: 10
  muse-wonder-1.0: 6
voice_max_concurrent_streams: 2
llm_min_seconds_between_calls_live_mode: 5

retries:
  on_429_max: 3
  backoff_start_ms: 500
  on_transient_5xx_max: 2
  sam_max: 1
  on_400: 0

timeouts_seconds:
  llm: 60
  sam_clip: 120
  together: 300         # hosted, about 100 output tokens per second
  wonder: 180          # writing a controller takes longer than a short JSON answer
  glimmer: 900          # a 30B model on two T4s decodes slowly; still bounded
  image_edit: 120        # the image model refines in passes before it returns

circuit_breaker:
  consecutive_failures: 5
  pause_seconds: 120

agent:
  max_turns: 4

reasoning:
  meta_effort_default: minimal     # Responses API; "none" is rejected
  glimmer_strength_default: low    # Glimmer template default would be high

output_token_limits:
  meta_max_output_tokens_default: 2000
  glimmer_max_tokens_default: 8000

media:
  llm_keyframes_max: 4
  llm_image_long_side_px: 768
  dev_max_clip_seconds: 20
  dev_max_resolution: 1080
  sam_max_fps_recorded: 30
  sam_fps_live: 25
  sam_min_frames_per_request: 50
  files_api_expires_seconds: 86400

setup_guide:
  # Outside the padded mark boxes the edit must keep the scene (structural similarity at least this).
  # TODO(verify) on the first approved call: the model re-renders the whole frame at its own resolution, so check
  # what similarity a good edit actually reaches before trusting this starting value.
  ssim_outside_min: 0.80
  # Inside the boxes something must have been drawn: mean absolute change on a 0-255 scale.
  change_inside_min: 6.0
  box_padding_fraction: 0.05
# Controllers written by Muse Wonder and tested in MuJoCo.
control:
  max_attempts: 3                 # per task; after that the honest "no controller met the goal"
  success_fraction: 0.90          # of the robustness set (nominal plus bootstrap samples), nominal included
  bootstrap_samples: 50
  sample_seed: 7
  wonder_effort: low              # never high/xhigh/max
  wonder_max_output_tokens: 8000  # reasoning plus the code
  sandbox_cpu_seconds: 25         # per evaluation set, enforced with RLIMIT_CPU in the child process
  sandbox_wall_seconds: 30
  sandbox_memory_mb: 1536         # RLIMIT_AS; numpy and MuJoCo need a few hundred MB of address space
