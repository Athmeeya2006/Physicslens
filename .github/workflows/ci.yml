name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: the slow statistical checks in full (for example 20 noise seeds, not 2)

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # numpy 2.5, scipy 1.18, photutils 3.1 and sunpy 8 need Python 3.12
    env:
      MOCK_MODELS: "1"
      APP_ENV: dev
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend tests scripts
      - name: README numbers match their sources
        run: python scripts/readme_numbers.py
      - name: Tests (mocked models, no network, no spend; the slow ones run in their own job)
        run: PHYSICSLENS_FIT_WORKERS=1 pytest -q -n auto -m "not slow" tests

  backend-slow:
    # The long physics checks (N-body searches, full live sessions), apart so they never push the fast job past its limit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOCK_MODELS: "1"
      APP_ENV: dev
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: pip install -r backend/requirements.txt
      - name: Slow tests (mocked models, no network, no spend)
        run: PHYSICSLENS_FIT_WORKERS=1 pytest -q -n auto -m slow tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Generated site data (gallery bundle, sky scenarios, cases, astronomy files)
        working-directory: .
        env:
          PYTHONPATH: backend
          MOCK_MODELS: "1"
          APP_ENV: dev
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r backend/requirements.txt
          make site-data BIN="$(dirname "$(which python)")" SKY_FLAGS=--no-discover
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Static build
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: ""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every page renders with no analysis server
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          (cd out && python -m http.server 8777 --bind 127.0.0.1 &)
          sleep 2
          python ../scripts/static_pages_check.py http://127.0.0.1:8777
