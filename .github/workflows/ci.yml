name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MOCK_MODELS: "1"
      APP_ENV: dev
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend tests scripts
      - name: README numbers match their sources
        run: python scripts/readme_numbers.py
      - name: Tests (mocked models, no network, no spend)
        run: PHYSICSLENS_FIT_WORKERS=1 pytest -q -n auto tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Static build
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: ""
